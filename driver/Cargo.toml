# Built as a member of the upstream workspace (hyperledger-iroha/iroha @ 071e281e) so it
# shares its Cargo.lock and [patch] section: see Dockerfile. Versions not pinned here
# resolve to the ones already in that lockfile.
[package]
name = "rd-dfabi"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iroha = { workspace = true }
iroha_core = { workspace = true, features = ["node", "simd"] }
iroha_crypto = { workspace = true, default-features = false, features = ["node-crypto"] }
iroha_model_base = { workspace = true }
iroha_primitives = { workspace = true }
norito = { workspace = true, default-features = false, features = ["node-codec"] }
eyre = { workspace = true }
hex = { workspace = true, features = ["std"] }
sha2 = "0.10.9"
rand = { workspace = true }
toml = { workspace = true }
url = { workspace = true, features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
